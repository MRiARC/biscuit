name: ✨ Feature request
description: Suggest a new feature or an enhancement to existing behavior
title: "feat: <short imperative summary>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Tell us what you want Biscuit to do that it
        does not do today. If you have already started writing code, please
        open a draft pull request instead and link it here.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is currently impossible or painful to do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Biscuit to do instead. Include a CLI / API sketch if useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they did not work.

  - type: dropdown
    id: stream
    attributes:
      label: Affected stream
      options:
        - Stream 1 — Core models, DB, ingestion
        - Stream 2 — Code grounding & lineage
        - Stream 3 — Extraction & provenance
        - Stream 4 — Watchdog & Switch bridge
        - Stream 5 — Evaluation & CLI
        - Cross-stream / infrastructure
        - Documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: pillar
    attributes:
      label: Pillar
      description: Which pillar of the two-pillar architecture does this affect?
      options:
        - Pillar 1 — Historical Knowledge Recovery
        - Pillar 2 — Living Decision Intelligence (Day 1+)
        - Both
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is a breaking change to existing behavior
        - label: This requires a new database migration
        - label: This requires a new optional dependency
        - label: I am willing to submit a PR for this

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched the existing issues for duplicates
          required: true
        - label: I have read the relevant doc under `docs/`
          required: true
