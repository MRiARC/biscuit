name: Intro App CI

on:
  push:
    branches: [main]
    paths:
      - "intro/**"
      - ".github/workflows/intro.yml"
  pull_request:
    branches: [main]
    paths:
      - "intro/**"
      - ".github/workflows/intro.yml"

jobs:
  build:
    name: Typecheck & build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: intro/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
