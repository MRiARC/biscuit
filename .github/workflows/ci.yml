name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: biscuit
          POSTGRES_PASSWORD: biscuit_test_password
          POSTGRES_DB: biscuit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[grounding]"

      # Cross-stream integration gate: optional grammars must actually parse both
      # Python and C; BISCUIT_REQUIRE_TREE_SITTER disables the test skip.
      - name: Exercise real Python and C Tree-sitter in strict mode
        env:
          BISCUIT_REQUIRE_TREE_SITTER: "1"
        run: python -m pytest -q tests/test_grounding.py

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Pytest Suite with Coverage
        env:
          TEST_POSTGRES_URL: postgresql://biscuit:biscuit_test_password@localhost:5432/biscuit_test
          BISCUIT_REQUIRE_TREE_SITTER: "1"
        run: |
          pytest -v --tb=short \
            --cov=src/biscuit \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14
