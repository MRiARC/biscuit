[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biscuit-intel"
version = "0.1.0"
description = "Open Source Decision Intelligence and Knowledge Recovery"
readme = "HACKATHON.md"
authors = [
    { name = "Chole Bhature" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlmodel>=0.0.18",
    "sqlalchemy>=2.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
# Optional strict CST backend. The core package stays zero-dependency for Stream 2.
grounding = [
    "tree-sitter>=0.22,<0.26",
    "tree-sitter-python>=0.21,<0.26",
    "tree-sitter-c>=0.21,<0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biscuit.db" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
