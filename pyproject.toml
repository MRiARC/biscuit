[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biscuit-intel"
version = "0.1.0"
description = "Open Source Decision Intelligence and Knowledge Recovery"
readme = "HACKATHON.md"
authors = [
    { name = "Chole Bhature" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    # Agent Bridge: MCP protocol server (Switch integration, Issue #20)
    "fastmcp>=3.2.0,<4",
    # HTTP transport for the Switch agent-session activity API
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
